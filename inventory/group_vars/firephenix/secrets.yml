---
# Every secret is fetched at run time from Proton Pass through pass-cli
# (vendored proton_pass lookup). Nothing secret lives in this repo.
#
# Layout in Proton Pass:
#   vault "firephenix": one custom item per service, secrets as hidden fields
#     whose names match the field= arguments below.
#   vault "homeserver": the registry login shared with the homeserver repo.
#   vault "ssh-keys":   SSH Key items (agent + GitHub deploy key public half).
#
# Run `pass-cli login` once on the controller before running any playbook.

# --- Registry (same credentials as the homeserver side) ---------------------
secret_firephenix_registry_password: "{{ lookup('proton_pass', 'registry', field='password', vault='homeserver') }}"

# --- MariaDB -----------------------------------------------------------------
secret_firephenix_db_root_password: "{{ lookup('proton_pass', 'mariadb', field='root_password') }}"
secret_firephenix_db_password: "{{ lookup('proton_pass', 'mariadb', field='password') }}"

# --- Backend + bot -----------------------------------------------------------
secret_firephenix_secret_key: "{{ lookup('proton_pass', 'backend', field='secret_key') }}"
secret_firephenix_openrouter_api_key: "{{ lookup('proton_pass', 'backend', field='openrouter_api_key') }}"
secret_firephenix_vpnapi_api_key: "{{ lookup('proton_pass', 'backend', field='vpnapi_api_key') }}"
secret_firephenix_discord_token: "{{ lookup('proton_pass', 'discord', field='bot_token') }}"

# --- TeamSpeak ---------------------------------------------------------------
# serveradmin ServerQuery password; the teamspeak container sets it on every start.
secret_firephenix_ts3_password: "{{ lookup('proton_pass', 'teamspeak', field='query_password') }}"

# --- Valkey ACL users --------------------------------------------------------
secret_firephenix_valkey_backend_password: "{{ lookup('proton_pass', 'valkey', field='backend') }}"
secret_firephenix_valkey_bot_password: "{{ lookup('proton_pass', 'valkey', field='bot') }}"
secret_firephenix_valkey_ttt_password: "{{ lookup('proton_pass', 'valkey', field='ttt') }}"
secret_firephenix_valkey_limiter_password: "{{ lookup('proton_pass', 'valkey', field='limiter') }}"
secret_firephenix_valkey_health_password: "{{ lookup('proton_pass', 'valkey', field='health') }}"

# --- TTT game server ---------------------------------------------------------
secret_ttt_gslt: "{{ lookup('proton_pass', 'ttt', field='gslt') }}"
secret_ttt_rcon_password: "{{ lookup('proton_pass', 'ttt', field='rcon_password') }}"
secret_ttt_server_password: "{{ lookup('proton_pass', 'ttt', field='server_password') }}"
# Comma-separated in Proton Pass, list here.
secret_admin_steam_ids: "{{ lookup('proton_pass', 'admins', field='steam_ids').split(',') | map('trim') | reject('equalto', '') | list }}"

# --- GitHub Actions deploy key (public half; CI holds the private half) -----
secret_firephenix_github_deploy_public_key: "{{ lookup('proton_pass', 'firephenix-github-deploy', field='public_key', vault='ssh-keys') }}"
