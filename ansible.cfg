[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Vendored proton_pass lookup, see plugins/lookup/proton_pass.py.
lookup_plugins = plugins/lookup
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
local_tmp = /tmp/.ansible-local
remote_tmp = /tmp/.ansible-remote
stdout_callback = default
result_format = yaml
bin_ansible_callbacks = True
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
become_ask_pass = False

# Secrets come from Proton Pass; see inventory/group_vars/firephenix/secrets.yml.
[proton_pass_lookup]
vault = firephenix

# SSH keys are served by the Proton Pass SSH agent on the controller.
[ssh_connection]
ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o IdentityAgent=~/.ssh/proton-pass-agent.sock
